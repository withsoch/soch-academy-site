name: Deploy to Vercel

# Why this exists instead of Vercel's native Git integration:
# Vercel's Hobby plan cannot connect to a PRIVATE repository owned by a GitHub
# organization. This workflow builds the site here on GitHub and uploads the
# finished artifact with `vercel deploy --prebuilt`, so Vercel never needs to
# read the private repo. Push to main -> production. Any other branch or PR ->
# preview URL. See vercel.com/docs/git/vercel-for-github#using-github-actions

on:
  push:
    branches:
      - main
      - academy-feedback-revisions
      - mahad-feedback
      - original-version
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push to the same branch cancels an in-flight deploy for that branch.
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # `github.ref == refs/heads/main` on a push is the only thing that ships to
    # the production domain. PRs targeting main still get preview URLs only.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "target=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project settings
        run: >-
          vercel pull --yes
          --environment=${{ steps.env.outputs.target }}
          --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ steps.env.outputs.prod_flag }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.env.outputs.prod_flag }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed (${{ steps.env.outputs.target }}): $url"

      - name: Summary
        run: |
          {
            echo "### Vercel deploy"
            echo ""
            echo "- **Environment:** ${{ steps.env.outputs.target }}"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **URL:** ${{ steps.deploy.outputs.url }}"
            if [ "${{ steps.env.outputs.target }}" = "production" ]; then
              echo "- **Live at:** https://academy.withsoch.com"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
